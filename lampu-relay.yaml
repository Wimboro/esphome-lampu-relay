---
# ESP32-C3 Super Mini: 3 relay 5 V (tanpa optocoupler) + 3 saklar listrik biasa.
# Saklar = jumper GPIO ke GND lewat kontak MERAH & PUTIH (bukan baut 220 V).
# Lampu 220 V hanya di COM/NO relay.
# 5V USB → VCC ketiga modul. GND bersama.
# ON = open-drain tarik IN ke GND. OFF = lepas pin (modul pull IN ke 5V).
# Relay IN: GPIO 4 / 2 / 6. Saklar: GPIO 9 / 8 / 5 ke putih; GND ke merah.
esphome:
  name: lampu-relay
  friendly_name: Lampu Relay

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Lampu Relay Fallback"
    password: !secret ap_password

captive_portal:

# Jangan GPIO10 (flash CS), GPIO20/21 (USB Serial/JTAG).
switch:
  - platform: gpio
    id: lampu_a
    name: "Lampu A"
    icon: mdi:ceiling-light
    restore_mode: RESTORE_DEFAULT_OFF
    pin:
      number: 4
      inverted: true
      mode:
        output: true
        open_drain: true
  - platform: gpio
    id: lampu_b
    name: "Lampu B"
    icon: mdi:ceiling-light
    restore_mode: RESTORE_DEFAULT_OFF
    pin:
      number: 2
      inverted: true
      mode:
        output: true
        open_drain: true
  - platform: gpio
    id: lampu_c
    name: "Lampu C"
    icon: mdi:ceiling-light
    restore_mode: RESTORE_DEFAULT_OFF
    pin:
      number: 6
      inverted: true
      mode:
        output: true
        open_drain: true

binary_sensor:
  - platform: gpio
    id: saklar_a
    name: "Saklar A"
    pin:
      number: 9
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 50ms
    on_state:
      then:
        - switch.toggle: lampu_a
  - platform: gpio
    id: saklar_b
    name: "Saklar B"
    pin:
      number: 8
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 50ms
    on_state:
      then:
        - switch.toggle: lampu_b
  - platform: gpio
    id: saklar_c
    name: "Saklar C"
    pin:
      number: 5
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 50ms
    on_state:
      then:
        - switch.toggle: lampu_c
